<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heimdall traffic · __TITLE__</title>
  <style>
    :root {
      --bg:#0a0c10; --panel:#10141b; --line:#1e2633; --text:#e6ebf2;
      --dim:#7d8b9e; --stroke:#3a4658;
    }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; background:var(--bg); color:var(--text);
      font-family: ui-sans-serif, system-ui, sans-serif; }
    header { height:52px; display:flex; align-items:center; gap:14px;
      padding:0 18px; border-bottom:1px solid var(--line); }
    header h1 { font-size:13px; font-weight:550; letter-spacing:.08em;
      text-transform:uppercase; margin:0; color:var(--dim); }
    header .hyp { font-size:13px; color:var(--dim); overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap; }
    .wrap { display:grid; grid-template-columns:1fr 340px; height:calc(100% - 52px); }
    @media (max-width:900px) { .wrap { grid-template-columns:1fr; grid-template-rows:minmax(240px, 45vh) 1fr; } #panel { border-left:0; border-top:1px solid var(--line); } }
    #net { overflow:auto; }
    #net.empty { display:flex; align-items:center; justify-content:center; color:var(--dim); }
    svg.dag { display:block; overflow:hidden; }
    .cell { width:100%; height:100%; padding:10px 12px; overflow:hidden;
      display:flex; flex-direction:column; justify-content:center; box-sizing:border-box; pointer-events:none; }
    .cell.start { align-items:center; text-align:center; }
    .cell .t, .cell .s { display:block; max-width:100%; overflow:hidden;
      white-space:nowrap; text-overflow:ellipsis; }
    .cell .t { font-size:13px; font-weight:560; color:var(--text); line-height:1.25; }
    .cell .s { margin-top:4px; font-size:11px; color:var(--dim); line-height:1.25; }
    g[data-id] { cursor:pointer; }
    #panel { border-left:1px solid var(--line); overflow:auto; padding:22px 20px 40px; background:var(--panel); }
    #panel .kicker { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
    #panel h2 { font-size:18px; font-weight:560; margin:6px 0 8px; }
    #panel .sub { color:var(--dim); font-size:13px; margin-bottom:12px; }
    #panel pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; line-height:1.6; }
    #panel p, #panel h4 { overflow-wrap:anywhere; }
    #panel summary { cursor:pointer; }
    #story { font-size:13px; line-height:1.55; color:#c5cdd8; white-space:pre-wrap;overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>explore · __TITLE__</h1>
    <div class="hyp" id="hyp"></div>
  </header>
  <div class="wrap">
    <div id="net" class="empty">waiting for layout</div>
    <aside id="panel"><div class="sub">Select a node for its conclusion, steps and evidence.</div><pre id="story"></pre></aside>
  </div>
  <script>
    const G = __GRAPH__;
    const FILL = {
      start:"#121820", recon:"#161c26", direction:"#1a1730",
      endpoint:"#182028", path:"#1a2220",
      scan:"#241418", flag:"#2a2414", next:"#14241c",
    };
    const STROKE = {
      start:"#5b7a96", recon:"#3a4658", direction:"#7c6cb0",
      endpoint:"#6a849c", path:"#6fbf93",
      scan:"#c97a82", flag:"#d7b56d", next:"#6fbf93",
    };
    const MISS_FILL = "#241418", MISS_STROKE = "#c97a82";
    const LOCK_STROKE = "#d7b56d";
    function esc(t) {
      return String(t == null ? "" : t).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }
    document.getElementById("hyp").textContent = G.hypothesis || "";
    document.getElementById("story").textContent = (G.agent_story || []).join("\n") || "";
    let SELECTED = null;
    function draw(el) {
      const view = G.view || {};
      const nodes = view.nodes || [];
      const edges = view.edges || [];
      if (!nodes.length) { el.className = "empty"; el.textContent = "no DAG to draw yet"; return; }
      const W = G.width || 800, H = G.height || 320;
      const by = Object.fromEntries(nodes.map(n => [n.id, n]));
      let s = `<svg class="dag" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`;
      s += `<defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#5a6a80"/></marker>`;
      for (const n of nodes) {
        const clip = "c_" + String(n.id).replace(/[^A-Za-z0-9_-]/g, "_");
        const rx = (n.group || "") === "start" ? n.height / 2 : 10;
        s += `<clipPath id="${clip}"><rect x="${n.x + 1}" y="${n.y + 1}" width="${Math.max(0, n.width - 2)}" height="${Math.max(0, n.height - 2)}" rx="${Math.max(0, rx - 1)}"/></clipPath>`;
      }
      s += `</defs>`;
      for (const e of edges) {
        const a = by[e.from], b = by[e.to];
        if (!a || !b) continue;
        const x1 = a.x + a.width, y1 = a.y + a.height / 2;
        const x2 = b.x, y2 = b.y + b.height / 2;
        const mx = (x1 + x2) / 2;
        const dash = e.dashes ? ' stroke-dasharray="4 4"' : "";
        const openE = e.tone === "open" || (b && b.status === "open");
        const eStroke = openE ? "#ea580c" : "#5a6a80";
        s += `<path d="M${x1} ${y1} C${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" stroke="${eStroke}" stroke-width="1.25"${dash} marker-end="url(#arr)"/>`;
      }
      for (const n of nodes) {
        const g = n.group || "recon";
        let fill = FILL[g] || FILL.recon;
        let stroke = STROKE[g] || STROKE.recon;
        if (n.status === "lock" || n.locked) stroke = LOCK_STROKE;
        if (n.status === "live") {
          fill = "#14241c";
          stroke = "#6fbf93";
        }
        if (n.status === "miss") {
          fill = MISS_FILL;
          stroke = MISS_STROKE;
        }
        if (n.status === "open") {
          fill = "#fff7ed";
          stroke = "#ea580c";
        }
        const on = SELECTED === n.id;
        const rx = g === "start" ? n.height / 2 : 10;
        const clip = "c_" + String(n.id).replace(/[^A-Za-z0-9_-]/g, "_");
        s += `<g data-id="${esc(n.id)}">`;
        s += `<rect x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${on ? 2.2 : 1}"/>`;
        s += `<foreignObject x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" clip-path="url(#${clip})">`;
        s += `<div xmlns="http://www.w3.org/1999/xhtml" class="cell${g === "start" ? " start" : ""}">`;
        s += `<span class="t" style="color:${n.status === "open" ? "#9a3412" : "#e6ebf2"}">${esc(n.label || n.id)}</span>`;
        if (n.sub) s += `<span class="s" style="color:${n.status === "open" ? "#9a3412" : "#7d8b9e"}">${esc(n.sub)}</span>`;
        s += `</div></foreignObject></g>`;
      }
      s += "</svg>";
      el.className = "";
      el.innerHTML = s;
      el.querySelectorAll("g[data-id]").forEach(g => {
        g.onclick = () => {
          const n = nodes.find(x => x.id === g.getAttribute("data-id"));
          if (!n) return;
          SELECTED = n.id;
          draw(el);
          const p = document.getElementById("panel");
          const summary = n.summary;
          const refs = rs => (rs || []).map(ref => {
            const e = (G.evidence || {})[ref];
            return "<details><summary>" + esc(ref) + "</summary>" + (e ?
              "<p>" + esc(e.kind) + " · " + esc(e.jobId) + "</p><pre>" + esc(e.text) + "</pre>" +
              (e.truncated ? "<p>日志摘录 / shortened excerpt</p>" : "") :
              "<p>证据未包含在此导出中 / Evidence unavailable in this export</p>") + "</details>";
          }).join("");
          p.innerHTML = "<div class='kicker'>" + esc(n.status || n.group) + "</div><h2>" + esc(n.label || n.id) +
            "</h2><p>" + (n.source === "system" ? "系统记录 / System record" : "观察者整理 / Compiled by observer") + "</p><h3>当前结论 / Conclusion</h3><p>" + esc(summary.conclusion) +
            "</p><h3>关键依据 / Basis</h3><p>" + esc(summary.basis) + "</p>" +
            (summary.uncertainty ? "<h3>尚未确认 / Unconfirmed</h3><p>" + esc(summary.uncertainty) + "</p>" : "") + refs(n.evidenceRefs) +
            "<h3>关键过程 / Key steps</h3>" + (n.steps.length ? "<ol>" + n.steps.map(step => "<li><h4>" + esc(step.action) +
              "</h4><pre>" + esc(step.result) + "</pre>" + (step.assessment ? "<p>观察者判断 / Assessment: " + esc(step.assessment) + "</p>" : "") +
              refs(step.evidenceRefs) + "</li>").join("") + "</ol>" : "<p>无单独尝试步骤 / No separate attempts</p>");
        };
      });
    }
    draw(document.getElementById("net"));
  </script>
</body>
</html>
