# Copy to tools.env.yaml and fill in. tools.env.yaml is gitignored — never commit keys.
#
#   cp tools.env.example.yaml tools.env.yaml
#
# Rules:
#   - Non-proxy keys: only non-empty values are injected
#   - Proxy keys may be "" to clear a host/Docker proxy
#   - No ${VAR} expansion; no inherit from the host environment
#   - ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN sync if only one is set
#   - Leave loop empty to reuse the Pi / observer credentials

version: 1

# ---------------------------------------------------------------------------
# Pi solver + observer (Anthropic-compatible API)
# ---------------------------------------------------------------------------
claude:
  ANTHROPIC_API_KEY: ""
  ANTHROPIC_AUTH_TOKEN: ""
  ANTHROPIC_BASE_URL: ""
  ANTHROPIC_MODEL: ""
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: ""
  OPENAI_MODEL: ""
  HEIMDALL_LLM_BASE_URL: ""
  HEIMDALL_LLM_PROVIDER: ""
  HEIMDALL_LLM_API: "anthropic"
  HEIMDALL_AGENT_MODEL: ""
  HEIMDALL_THINKING: "high"

# ---------------------------------------------------------------------------
# Loop Claude Code SDK. Empty key/url/model → reuse claude: above.
# ---------------------------------------------------------------------------
loop:
  HEIMDALL_LOOP_API_KEY: ""
  HEIMDALL_LOOP_AUTH_TOKEN: ""
  HEIMDALL_LOOP_BASE_URL: ""
  HEIMDALL_LOOP_MODEL: ""
  HEIMDALL_LOOP_API: "anthropic"
  HEIMDALL_LOOP_PROVIDER: ""
  HEIMDALL_LOOP_THINKING: "max"

# ---------------------------------------------------------------------------
# Observer. Leave URL/key/model empty to follow claude:.
# ---------------------------------------------------------------------------
coach:
  HEIMDALL_COACH: "1"
  HEIMDALL_COACH_BASE_URL: ""
  HEIMDALL_COACH_API_KEY: ""
  HEIMDALL_COACH_AUTH_TOKEN: ""
  HEIMDALL_COACH_MODEL: ""
  HEIMDALL_COACH_API: "anthropic"
  HEIMDALL_COACH_TIMEOUT: "12"
  HEIMDALL_OBSERVER_EVERY_SEC: "300"
  HEIMDALL_OBSERVER_WARMUP_SEC: "300"
  # Independent budget for accepted-flag / succeeded / timeout recap (seconds).
  HEIMDALL_OBSERVER_FINALIZE_SEC: "300"

# ---------------------------------------------------------------------------
# Outbound traffic is direct. Runtime launchers clear inherited proxy settings.
# ---------------------------------------------------------------------------
proxy:
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: "*"
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  no_proxy: "*"

# Optional tool-specific environment blocks.
tools: {}

env: {}

required: []
