# Copy to tools.env.yaml and fill in. tools.env.yaml is gitignored — never commit keys.
#
#   cp tools.env.example.yaml tools.env.yaml
#
# Rules:
#   - Non-proxy keys: only non-empty values are injected
#   - Proxy keys may be "" to clear a host/Docker proxy
#   - No ${VAR} expansion. Model fields fall back to process environment;
#     non-empty saved values take precedence. Other host secrets are not inherited.
#   - ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN sync if only one is set
#   - Leave loop empty to reuse the Pi credentials only with an Anthropic-compatible endpoint

version: 1

# ---------------------------------------------------------------------------
# Pi solver + observer (Anthropic / Chat Completions / Responses)
# ---------------------------------------------------------------------------
claude:
  ANTHROPIC_API_KEY: ""
  ANTHROPIC_AUTH_TOKEN: ""
  ANTHROPIC_BASE_URL: ""
  ANTHROPIC_MODEL: ""
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: ""
  OPENAI_MODEL: ""
  HEIMDALL_LLM_BASE_URL: ""
  HEIMDALL_LLM_PROVIDER: ""
  HEIMDALL_LLM_API: "anthropic"  # anthropic | openai | responses | auto
  # Native Grok: https://api.x.ai/v1 + grok-4.7 + responses + capability profile auto.
  # XAI_API_KEY is also accepted when using the agent directly.
  HEIMDALL_AGENT_MODEL: ""
  # Use auto for exact catalog matches, or explicitly reuse a protocol for a new model ID.
  HEIMDALL_CAPABILITY_PROFILE: "auto"  # deepseek | claude-adaptive | anthropic-budget | thinking-toggle | openai-effort | grok | grok-default | none | custom
  HEIMDALL_CAPABILITY_PROVIDER: ""     # catalog namespace, e.g. xai or deepseek; independent of API protocol
  HEIMDALL_CAPABILITY_CUSTOM: ""       # JSON profile when profile=custom
  HEIMDALL_THINKING: "high"
  HEIMDALL_THINKING_MODE: "auto"  # auto | adaptive | enabled | disabled
  # Optional tuning; blank uses model-aware defaults. See docs/model-settings.md.
  HEIMDALL_CONTEXT_WINDOW: ""       # tokens; unknown Pi models default to 128000
  HEIMDALL_MAX_OUTPUT_TOKENS: ""
  HEIMDALL_THINKING_BUDGET: ""      # fixed token budget, supported protocols only
  HEIMDALL_REASONING: "auto"       # auto | true | false
  HEIMDALL_COMPACT_ENABLED: "true"
  HEIMDALL_COMPACT_PCT: "70"
  HEIMDALL_COMPACT_KEEP_RECENT_TOKENS: ""

# ---------------------------------------------------------------------------
# Loop Claude Code SDK. Empty connection reuses claude: only when Anthropic-compatible.
# Native xAI is Pi-only; configure a separate Anthropic gateway/model for SDK Loop.
# ---------------------------------------------------------------------------
loop:
  HEIMDALL_LOOP_API_KEY: ""
  HEIMDALL_LOOP_AUTH_TOKEN: ""
  HEIMDALL_LOOP_BASE_URL: ""
  HEIMDALL_LOOP_MODEL: ""
  HEIMDALL_LOOP_API: "anthropic"
  HEIMDALL_LOOP_PROVIDER: ""
  HEIMDALL_LOOP_CAPABILITY_PROFILE: "auto"
  HEIMDALL_LOOP_CAPABILITY_PROVIDER: ""
  HEIMDALL_LOOP_CAPABILITY_CUSTOM: ""
  HEIMDALL_LOOP_THINKING: "max"
  HEIMDALL_LOOP_THINKING_MODE: "auto"  # auto | adaptive | enabled | disabled
  HEIMDALL_LOOP_THINKING_BUDGET: ""    # set only for fixed-budget thinking
  HEIMDALL_LOOP_CONTEXT_WINDOW: ""    # SDK/catalog default; never adds [1m]
  HEIMDALL_LOOP_MAX_OUTPUT_TOKENS: ""
  HEIMDALL_LOOP_COMPACT_ENABLED: "true"
  HEIMDALL_LOOP_COMPACT_PCT: "70"

# ---------------------------------------------------------------------------
# Observer. Follows loop: first, then coach:, then claude: connection values.
# Its Pi tuning uses independent defaults, not the solver/Claude token budgets.
# ---------------------------------------------------------------------------
coach:
  HEIMDALL_COACH: "1"
  HEIMDALL_COACH_BASE_URL: ""
  HEIMDALL_COACH_API_KEY: ""
  HEIMDALL_COACH_AUTH_TOKEN: ""
  HEIMDALL_COACH_MODEL: ""
  HEIMDALL_COACH_API: "anthropic"
  HEIMDALL_COACH_TIMEOUT: "12"
  HEIMDALL_OBSERVER_EVERY_SEC: "300"
  HEIMDALL_OBSERVER_WARMUP_SEC: "300"
  # Independent budget for accepted-flag / succeeded / timeout recap (seconds).
  HEIMDALL_OBSERVER_FINALIZE_SEC: "300"

# ---------------------------------------------------------------------------
# Outbound traffic is direct. Runtime launchers clear inherited proxy settings.
# ---------------------------------------------------------------------------
proxy:
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: "*"
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  no_proxy: "*"

# Optional tool-specific environment blocks.
tools: {}

env: {}

required: []
